function kv(a, b, cls) { return '<div class="kv"><span>' + a + '</span><span class="' + (cls || '') + '">' + b + '</span></div>'; }
function tbl(heads, rows, meta) {
  meta = meta || {}; lastTbl = { heads: heads, rows: rows };
  var h = '<div class="tw"><table><thead><tr>' + heads.map(function (x, i) { return '<th class="' + (meta.t && meta.t.indexOf(i) >= 0 ? 't' : '') + '">' + esc(x) + '</th>'; }).join('') + '</tr></thead><tbody>';

  }

document.addEventListener('click', function (ev) {

  if (el.hasAttribute('data-act')) return act(el.getAttribute('data-act'), el);
  if (el.hasAttribute('data-v')) return go(el.getAttribute('data-v'));
  if (el.hasAttribute('data-es')) { var kv2 = el.getAttribute('data-es').split(':'); cur[kv2[0]] = kv2[1]; return debSheet(); }
  if (el.hasAttribute('data-pick')) { cur.buyer = el.getAttribute('data-pick'); $('#pk').innerHTML = pickerHTML(); return; }
  if (el.hasAttribute('data-newb')) { var nb = { id: U.uid(), code: '', name: el.getAttribute('data-newb'), open: 0 }; S().buyers.push(nb); save(); recalc(); cur.buyer = nb.id; $('#pk').innerHTML = pickerHTML(); return; }

  if (el.hasAttribute('data-go')) { ui.date = el.getAttribute('data-go'); return go('day'); }
